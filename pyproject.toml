[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaux3-pieces"
version = "0.1.0"
description = "Projet académique de reconnaissance de pièces TWD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Équipe du projet Signaux III" }]
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
